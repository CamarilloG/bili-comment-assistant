# Pytest配置文件

[tool:pytest]
# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts = 
    -v
    --tb=short
    -s
    --strict-markers
    --color=yes

# 测试路径
testpaths = .

# 标记
markers =
    auth: 认证和登录相关测试
    search: 搜索功能测试
    antibot: 防风控测试
    integration: 集成测试
    slow: 慢速测试（需要较长时间）

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# 超时
timeout = 300

# 并发
# addopts = -n auto  # 需要安装 pytest-xdist
